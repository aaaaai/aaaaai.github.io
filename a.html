<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航空母舰-山东舰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(160deg, #f5f7fa 0%, #e8edf5 100%);
            min-height: 100vh;
            padding: 32px 20px 48px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 520px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1d1d1f;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #86868b;
            margin-bottom: 36px;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 12px;
            justify-content: flex-start;
        }

        /* 每行 5 个 */
        .icon-card {
            width: calc((100% - 48px) / 5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #1d1d1f;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .icon-card:active {
            transform: scale(0.94);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            overflow: hidden;
            flex-shrink: 0;
        }

        .icon-card:hover .icon-box {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
            transform: translateY(-2px);
        }

        .icon-label {
            font-size: 11px;
            line-height: 1.3;
            text-align: center;
            margin-top: 8px;
            color: #3a3a3c;
            font-weight: 500;
            word-break: break-all;
            max-width: 100%;
        }

        .icon-label small {
            display: block;
            font-size: 10px;
            color: #8e8e93;
            font-weight: 400;
            margin-top: 2px;
        }

        /* 品牌色 */
        .bg-cctv     { background: linear-gradient(135deg, #d32f2f, #b71c1c); }
        .bg-bilibili { background: linear-gradient(135deg, #fb7299, #e34d7a); }
        .bg-tencent  { background: linear-gradient(135deg, #ff8c00, #e67e00); }
        .bg-iqiyi    { background: linear-gradient(135deg, #00be06, #009a04); }
        .bg-youku    { background: linear-gradient(135deg, #1e90ff, #0066cc); }
        .bg-mango    { background: linear-gradient(135deg, #ff6f00, #e65100); }
        .bg-cctv14   { background: linear-gradient(135deg, #8e24aa, #6a1b9a); }
        .bg-xuexi    { background: linear-gradient(135deg, #e53935, #c62828); }
        .bg-yoozb    { background: linear-gradient(135deg, #0f9d58, #0b7a43); }
        .bg-cctv-live{ background: linear-gradient(135deg, #c62828, #8e0000); }
        .bg-gaowen   { background: linear-gradient(135deg, #1565c0, #0d47a1); }
        .bg-migu     { background: linear-gradient(135deg, #ff5722, #d84315); }
        .bg-88kanqiu { background: linear-gradient(135deg, #00897b, #00695c); }

        .icon-text {
            font-size: 28px;
            line-height: 1;
        }

        /* 航空母舰图片区 */
        .ship-wrap {
            margin-top: 36px;
            text-align: center;
        }

        .ship-wrap img {
            width: 100%;
            max-width: 520px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: block;
            margin: 0 auto;
        }

        .ship-caption {
            margin-top: 12px;
            font-size: 13px;
            color: #86868b;
            text-align: center;
        }

        /* 小屏适配 */
        @media (max-width: 420px) {
            .container {
                max-width: 100%;
            }
            .grid {
                gap: 14px 8px;
            }
            .icon-card {
                width: calc((100% - 32px) / 5);
            }
            .icon-box {
                width: 52px;
                height: 52px;
                border-radius: 13px;
                font-size: 22px;
            }
            .icon-label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

        <!-- 航空母舰-山东舰图片 -->

            <img src="image/ship.png" alt="航空母舰-山东舰">
