<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀塔矛盾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b1a2a;
            background-image: radial-gradient(circle at 20% 30%, #1b3b4f 0%, #07131f 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #0f212f;
            border-radius: 36px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a4a5a inset, 0 0 15px #3e6a7e;
            padding: 24px 30px 30px;
            border: 1px solid #4e7b8f;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            color: #c2e0f0;
            text-shadow: 0 2px 4px black;
            padding: 0 8px;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e8d9b0, #b9a577);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px black);
        }

        .progress-badge {
            background: #162f3f;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 600;
            border: 1px solid #4e7b8f;
            box-shadow: 0 0 8px #1e4b5e inset;
            font-size: 1.1rem;
            color: #b5d9ec;
        }

        .progress-badge span {
            color: #f0d69a;
            font-size: 1.4rem;
            margin-right: 6px;
        }

        .question-panel {
            background: #102b3b;
            border-radius: 30px;
            padding: 26px 28px;
            border: 1px solid #3d6b81;
            box-shadow: 0 8px 0 #051019, 0 0 25px #1d4054 inset;
            margin-bottom: 20px;
            min-height: 140px;
            display: flex;
            align-items: center;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #eef7ff;
            line-height: 1.4;
            text-shadow: 0 2px 5px black;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .option-btn {
            background: #1a3345;
            border: 2px solid #35657e;
            border-radius: 18px;
            padding: 18px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #d7ecfa;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #0b1c28, 0 0 0 1px #2e5268 inset;
            letter-spacing: 0.3px;
        }

        .option-btn:hover:not(.disabled) {
            background: #234f66;
            border-color: #63a5c2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b1c28, 0 0 12px #5b9cbb;
        }

        .option-btn.correct {
            background: #1a5e3a;
            border-color: #9ae6b4;
            color: white;
            box-shadow: 0 0 18px #3fcc7a, 0 6px 0 #0a2e1d;
        }

        .option-btn.wrong {
            background: #6e2a2a;
            border-color: #e07c7c;
            color: #ffe2e2;
            box-shadow: 0 0 18px #d65454, 0 6px 0 #3d1515;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
            pointer-events: none;
        }

        .option-letter {
            background: #0a1a24;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #b9d9f0;
            border: 1px solid #517f99;
            box-shadow: 0 0 6px #2b5b74 inset;
            flex-shrink: 0;
            font-size: 1.3rem;
        }

        .option-btn.correct .option-letter {
            background: #0d3d22;
            color: #b3f0c1;
            border-color: #9ae6b4;
        }

        .option-btn.wrong .option-letter {
            background: #411818;
            color: #ffb8b8;
            border-color: #e07c7c;
        }

        /* 提示卡片 —— 新增 */
        .tip-box {
            background: #0a1c26;
            border-left: 6px solid #c9a64b;
            border-radius: 16px;
            padding: 16px 22px;
            margin: 10px 0 20px;
            color: #cfe3f0;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: 0 0 15px #1c3f52 inset, 0 6px 0 #051019;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .tip-box::before {
            content: "💡";
            font-size: 1.6rem;
            filter: drop-shadow(0 0 6px #f0d69a);
            margin-right: 4px;
        }

        .tip-content {
            flex: 1;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            min-height: 60px;
            margin-bottom: 8px;
        }

        .feedback-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #f0d69a;
            text-shadow: 0 1px 3px black;
        }

        .next-btn {
            background: #c9a64b;
            border: none;
            border-radius: 60px;
            padding: 14px 42px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #0d1b24;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 7px 0 #6a4f1c, 0 0 15px #e6c568;
            letter-spacing: 1px;
            border: 1px solid #fae9b0;
        }

        .next-btn:hover:not(:disabled) {
            background: #e0b85c;
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #6a4f1c, 0 0 25px #ffe28b;
        }

        .next-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #4a3815;
            transform: translateY(2px);
        }

        .score-display {
            font-size: 1.3rem;
            font-weight: 600;
            color: #d4e9ff;
            background: #102b3b;
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid #4e7b8f;
            display: inline-block;
        }

        .score-display span {
            color: #fadf8a;
            font-size: 1.6rem;
            margin-left: 8px;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid #4e6b7a;
            border-radius: 40px;
            padding: 10px 26px;
            color: #b8d4e8;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .reset-btn:hover {
            background: #1c3d4e;
            border-color: #8fb9d0;
            color: white;
        }

        /* 移动端适配 */
        @media (max-width: 650px) {
            .game-container {
                padding: 18px 16px 22px;
                border-radius: 26px;
            }

            .question-text {
                font-size: 1.25rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .option-btn {
                padding: 14px 14px;
                font-size: 1.1rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .progress-badge {
                font-size: 0.9rem;
                padding: 6px 14px;
            }

            .next-btn {
                padding: 12px 24px;
                font-size: 1.1rem;
            }

            .tip-box {
                font-size: 1rem;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>⚔️ 刀塔矛盾</h1>
            <div class="progress-badge">
                <span id="current-q">1</span>/<span id="total-q">100</span>
            </div>
        </div>

        <div class="question-panel">
            <div class="question-text" id="questionText">加载中...</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- 选项动态生成 -->
        </div>

        <!-- 提示卡片（无论对错都显示） -->
        <div class="tip-box" id="tipBox">
            <div class="tip-content" id="tipContent">点击选项后显示克制提示。</div>
        </div>

        <div class="feedback-area">
            <div class="feedback-text" id="feedbackMsg"></div>
            <div class="score-display">得分 <span id="scoreValue">0</span></div>
        </div>

        <div class="footer-controls">
            <button class="reset-btn" id="resetBtn">🔄 重新开始</button>
            <button class="next-btn" id="nextBtn" disabled>下一题 →</button>
        </div>
    </div>

    <script>
        // ---------- 题库: 100道 包含 tip 提示字段（最终校对版，基准版本 7.41f） ----------
const questions = [
    // ============ 1-10 风杖（小风杖 Eul / 大风杖 风暴之杖）/ 躲避类 ============
    // ✏️ 已修正（原"幽魂权杖"与风杖双解，换成林肯法球作干扰项）
    { q: "剑圣开大招「无敌斩」斩你，以下哪个装备能让你完全躲避伤害？", options: ["黑皇杖", "闪烁匕首", "林肯法球", "风杖（Eul的神圣法杖）"], correct: 3, tip: "风杖吹起自己后无敌且无法被选中，无敌斩的所有斩击都无法命中你。注意无敌斩是物理攻击，BKB完全无效，林肯也挡不住（它不是指向性技能）。" },
    { q: "帕吉的「肉钩」命中你后接「肢解」，你可以用什么装备瞬间躲避后续伤害？", options: ["风杖", "先锋盾", "挑战头巾", "板甲"], correct: 0, tip: "被肉钩命中后，在帕吉开启肢解前使用风杖吹起自己，可以躲掉肢解的持续伤害和减速。" },
    { q: "敌方莉娜「神灭斩」即将命中你，以下哪个道具可以让你躲开？", options: ["魔棒", "风杖", "魂之灵瓮", "微光披风"], correct: 1, tip: "风杖可以在神灭斩弹道命中前将自己吹起，完全躲避该技能。微光披风只能提供魔抗，不能完全躲避。" },
    // ✏️ 已修正（tip补充决斗穿透BKB + 大小风杖知识点）
    { q: "面对军团指挥官「决斗」，队友想救你，出什么装备可以让你不被决斗？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 2, tip: "风杖可以在军团跳刀决斗前吹起自己，使其无法选中你。林肯也能挡决斗，但风杖更主动。另外决斗无视技能免疫，BKB挡不住！注意：小风杖只能吹自己，队友若出了大风杖（风暴之杖）也可以直接把你吹起来救你。" },
    // ✏️ 已修正（tip补充大小风杖区别）
    { q: "以下哪件装备可以驱散「沉默」并让你短暂无敌？", options: ["分身斧", "风杖", "散华", "天堂之戟"], correct: 1, tip: "风杖（小风杖）使用后驱散自身负面效果并进入无敌状态，是法师面对沉默的常见自救装；升级成大风杖后还能对队友使用，帮队友驱散沉默。" },
    { q: "敌方血魔对你施放「割裂」，你走动会受到伤害，出什么装备可解？", options: ["风杖", "回音战刃", "韧鼓", "漩涡"], correct: 0, tip: "风杖吹起自己可以驱散割裂，落地后不再受到移动伤害。注意吹起期间不会掉血。" },
    { q: "风杖（Eul）可以躲避以下哪个技能？", options: ["瘟疫法师大招「死神镰刀」", "斧王「淘汰之刃」", "巫医「死亡守卫」", "以上均可（在合适时机）"], correct: 3, tip: "风杖在合适的时机可以躲掉几乎所有弹道技能和持续伤害，包括死神镰刀、淘汰之刃和死亡守卫的伤害。" },
    { q: "以下哪个英雄的技能无法被风杖躲避？", options: ["火女「神灭斩」", "宙斯「雷神之怒」", "莱恩「死亡之指」", "虚空假面「时间结界」"], correct: 1, tip: "宙斯的大招「雷神之怒」是全图即时伤害，没有弹道，风杖无法躲避。神灭斩和死亡之指有弹道，可以吹起躲掉。" },
    // ✏️ 已修正（风杖自吹带基础驱散，只有末日驱散不掉）
    { q: "你用风杖吹起自己，落地后以下哪个持续伤害依然会生效？", options: ["剧毒术士「毒刺」", "冥界亚龙「毒性攻击」", "末日使者「末日」", "以上都会（若已施加）"], correct: 2, tip: "风杖吹起时会施加一次基础驱散，毒刺、毒性攻击这类普通负面效果都会被驱散；只有末日无法被驱散，落地后依然持续。吹起期间你是无敌的，任何持续伤害都不会扣血。" },
    // ✏️ 已重写（原题"自己、队友或敌人"是大风杖机制，小风杖不能吹队友——改为直接考大小风杖区别）
    { q: "关于「小风杖（Eul）」和「大风杖（风暴之杖）」，以下说法正确的是？", options: ["两者都能把队友吹起来", "只有大风杖能把队友吹起来", "小风杖的吹风时间更长", "小风杖的冷却更短"], correct: 1, tip: "小风杖只能吹自己、敌人和自己的分身，不能吹队友；升级成大风杖后才能吹队友救人。两者吹风时间都是2.5秒，但大风杖冷却更短（16秒 vs 23秒），且自己被吹期间还能操控移动方向、穿越树林和地形。" },

    // ============ 11-20 黑皇杖 / 魔法免疫 ============
    { q: "敌方拥有高魔法爆发，你作为核心应该优先出什么？", options: ["黑皇杖", "蝴蝶", "撒旦之邪力", "金箍棒"], correct: 0, tip: "黑皇杖（BKB）提供技能免疫，能免疫绝大多数魔法伤害和控制，是核心对抗高魔法爆发的不二之选。" },
    // ✏️ 已修正（时间结界无视BKB，其余被挡，消除双解）
    { q: "黑皇杖（BKB）开启后，以下哪个技能依然能控制你？", options: ["莱恩「妖术」", "虚空假面「时间结界」", "莉娜「神灭斩」", "以上均不能"], correct: 1, tip: "时间结界无视技能免疫，开BKB照样被控住。妖术和神灭斩则会被BKB完全挡住。" },
    // ✏️ 已修正（原题两极反转/原始咆哮/黑洞三个都穿透，只留一个正确答案）
    { q: "以下哪个技能可以无视技能免疫（BKB）？", options: ["巫医「麻痹药剂」", "莱恩「妖术」", "兽王「原始咆哮」", "莉娜「神灭斩」"], correct: 2, tip: "原始咆哮对主目标无视技能免疫。同样无视技能免疫的还有谜团黑洞、猛犸两极反转、虚空时间结界、末日、全球沉默、肉钩等；妖术和麻痹药剂会被BKB挡住。" },
    { q: "面对敌方小鱼人「黑暗契约」的驱散，你出什么装备可以不被驱散？", options: ["黑皇杖", "林肯法球", "风杖", "永恒之盘"], correct: 0, tip: "BKB的技能免疫可以防止大部分驱散效果，包括小鱼人的黑暗契约。注意BKB不能防无视技能免疫的驱散。" },
    // ✏️ 已修正（BKB挡不住的是物理伤害；当前版本开启期间连纯粹伤害都免疫）
    { q: "黑皇杖无法抵挡以下哪类伤害？", options: ["魔法伤害", "纯粹伤害", "物理伤害", "以上均能抵挡"], correct: 2, tip: "BKB的技能免疫能挡住绝大多数魔法伤害，当前版本开启期间甚至对纯粹伤害免疫，但永远挡不住普通攻击的物理伤害——这也是物理核心不怕BKB的原因。" },
    // ✏️ 已修正（全球沉默无视技能免疫，BKB挡不住，正确答案是风杖）
    { q: "敌方沉默术士开启「全领域静默」，你应该出什么应对？", options: ["黑皇杖", "风杖", "原力法杖", "微光披风"], correct: 1, tip: "全领域静默会无视技能免疫，BKB根本挡不住！风杖可以在大招落下时吹起自己躲避，或者被沉默后吹起自己驱散。" },
    // ✏️ 已修正（当前版本BKB为9秒起步、最低7秒）
    { q: "黑皇杖的持续时间会随使用次数减少，最低降至多少秒？", options: ["7秒", "5秒", "4秒", "3秒"], correct: 0, tip: "当前版本BKB初始持续9秒，每次使用减少1秒，最低降至7秒。（老版本是10秒起步、最低4~5秒，别记混了。）" },
    // ✏️ 已修正（否决坠饰可以驱散BKB）
    { q: "以下哪个装备可以驱散「黑皇杖」的技能免疫效果？", options: ["散失之刃", "净化刀", "否决坠饰", "没有装备可以"], correct: 2, tip: "否决坠饰的主动「否决」可以直接驱散BKB的技能免疫，这也是它被称为「BKB克星」的原因；散失之刃和净化刀的普通驱散对BKB无效。" },
    { q: "BKB开启期间，你能被「大鱼人」的「伤害加深」影响吗？", options: ["能，因为无视技能免疫", "不能", "取决于天赋", "只有大招能"], correct: 0, tip: "大鱼人的伤害加深是无视技能免疫的，即使开启BKB依然会被施加，并受到额外物理伤害。（7.41f只削了鱼人碎击的伤害，腐蚀雾机制不变。）" },
    { q: "面对敌方黑皇杖，你应该出什么装备来克制？", options: ["金箍棒", "深渊之刃", "否决坠饰", "以上均可（视情况）"], correct: 3, tip: "深渊之刃可以无视BKB进行眩晕，否决坠饰可以驱散BKB的增益，金箍棒则针对闪避。根据局势选择。" },

    // ============ 21-30 林肯 / 防指向 ============
    { q: "敌方末日使者对你施放大招「末日」，你出什么装备可以抵挡？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 0, tip: "林肯法球可以抵挡末日使者的单体大招。注意如果末日先用其他技能破林肯，则需要等林肯冷却后再挡。" },
    // ✏️ 已修正（雷神之怒无目标林肯挡不住；消除肉钩/妖术双解）
    { q: "林肯法球可以抵挡以下哪个技能？", options: ["宙斯「雷神之怒」", "谜团「黑洞」", "莱恩「妖术」", "以上均可抵挡"], correct: 2, tip: "林肯只抵挡单体指向性技能。雷神之怒是全图无目标技能、黑洞是无目标持续技能，都无法被林肯抵挡；妖术是指向性技能，可以被挡掉。" },

        // ---------- 状态 ----------
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let correctOptionIndex = -1;

        // DOM 元素
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const currentQSpan = document.getElementById('current-q');
        const totalQSpan = document.getElementById('total-q');
        const scoreValueSpan = document.getElementById('scoreValue');
        const tipContent = document.getElementById('tipContent'); // 新增提示内容容器

        // 初始化显示总题数
        totalQSpan.textContent = questions.length;

        // ---------- 辅助函数 ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 加载题目
        function loadQuestion(index) {
            answered = false;
            nextBtn.disabled = true;
            feedbackMsg.textContent = '';

            // 清空提示区域 (等待用户作答后再显示)
            tipContent.textContent = '点击选项后显示克制提示。';

            const qData = questions[index];
            if (!qData) return;

            questionText.textContent = qData.q;

            const correctText = qData.options[qData.correct];
            const shuffledOptions = shuffleArray([...qData.options]);
            correctOptionIndex = shuffledOptions.indexOf(correctText);

            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];

            shuffledOptions.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-index', idx);
                btn.innerHTML = `<span class="option-letter">${letters[idx]}</span>${optText}`;
                btn.addEventListener('click', () => handleOptionClick(idx, btn));
                optionsContainer.appendChild(btn);
            });

            currentQSpan.textContent = index + 1;
            scoreValueSpan.textContent = score;
        }

        // 处理选项点击
        function handleOptionClick(selectedIdx, btnElement) {
            if (answered) return;

            const allOptions = document.querySelectorAll('.option-btn');
            const isCorrect = (selectedIdx === correctOptionIndex);

            allOptions.forEach(btn => btn.classList.add('disabled'));

            allOptions.forEach((btn, idx) => {
                if (idx === correctOptionIndex) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                score++;
                scoreValueSpan.textContent = score;
                feedbackMsg.textContent = '✅ 正确！ 克制关系掌握得不错。';
            } else {
                feedbackMsg.textContent = `❌ 错误！ 正确答案是 ${String.fromCharCode(65 + correctOptionIndex)}。`;
            }

            // 显示当前题目的提示 (无论对错)
            const currentQ = questions[currentIndex];
            if (currentQ && currentQ.tip) {
                tipContent.textContent = currentQ.tip;
            } else {
                tipContent.textContent = '（本题暂无额外提示）';
            }

            answered = true;
            nextBtn.disabled = false;
        }

        // 下一题
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                if (currentIndex === questions.length - 1 && answered) {
                    if (nextBtn.disabled) return;
                    questionText.textContent = `🎉 恭喜你完成全部 ${questions.length} 题！ 最终得分: ${score} / ${questions.length}`;
                    optionsContainer.innerHTML = '';
                    feedbackMsg.textContent = score >= 80 ? '🌟 大神！你对Dota2克制关系了如指掌。' : 
                                              score >= 50 ? '👍 还不错，再巩固一下细节吧。' : '📘 多看看装备和技能说明，再来挑战！';
                    // 完成时提示区域显示总结
                    tipContent.textContent = '克制之道，在于知己知彼。多实践，多思考，你也能成为刀塔智者。';
                    nextBtn.disabled = true;
                    currentQSpan.textContent = questions.length;
                } else {
                    if (!answered) return;
                }
            }
        }

        // 重置游戏
        function resetGame() {
            currentIndex = 0;
            score = 0;
            answered = false;
            scoreValueSpan.textContent = '0';
            loadQuestion(0);
            feedbackMsg.textContent = '';
            tipContent.textContent = '点击选项后显示克制提示。';
        }

        // 初始化
        function init() {
            loadQuestion(0);
            nextBtn.addEventListener('click', nextQuestion);
            resetBtn.addEventListener('click', resetGame);
        }

        init();
    </script>
