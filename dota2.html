<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀塔矛盾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b1a2a;
            background-image: radial-gradient(circle at 20% 30%, #1b3b4f 0%, #07131f 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #0f212f;
            border-radius: 36px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a4a5a inset, 0 0 15px #3e6a7e;
            padding: 24px 30px 30px;
            border: 1px solid #4e7b8f;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            color: #c2e0f0;
            text-shadow: 0 2px 4px black;
            padding: 0 8px;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e8d9b0, #b9a577);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px black);
        }

        .progress-badge {
            background: #162f3f;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 600;
            border: 1px solid #4e7b8f;
            box-shadow: 0 0 8px #1e4b5e inset;
            font-size: 1.1rem;
            color: #b5d9ec;
        }

        .progress-badge span {
            color: #f0d69a;
            font-size: 1.4rem;
            margin-right: 6px;
        }

        .question-panel {
            background: #102b3b;
            border-radius: 30px;
            padding: 26px 28px;
            border: 1px solid #3d6b81;
            box-shadow: 0 8px 0 #051019, 0 0 25px #1d4054 inset;
            margin-bottom: 20px;
            min-height: 140px;
            display: flex;
            align-items: center;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #eef7ff;
            line-height: 1.4;
            text-shadow: 0 2px 5px black;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .option-btn {
            background: #1a3345;
            border: 2px solid #35657e;
            border-radius: 18px;
            padding: 18px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #d7ecfa;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #0b1c28, 0 0 0 1px #2e5268 inset;
            letter-spacing: 0.3px;
        }

        .option-btn:hover:not(.disabled) {
            background: #234f66;
            border-color: #63a5c2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b1c28, 0 0 12px #5b9cbb;
        }

        .option-btn.correct {
            background: #1a5e3a;
            border-color: #9ae6b4;
            color: white;
            box-shadow: 0 0 18px #3fcc7a, 0 6px 0 #0a2e1d;
        }

        .option-btn.wrong {
            background: #6e2a2a;
            border-color: #e07c7c;
            color: #ffe2e2;
            box-shadow: 0 0 18px #d65454, 0 6px 0 #3d1515;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
            pointer-events: none;
        }

        .option-letter {
            background: #0a1a24;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #b9d9f0;
            border: 1px solid #517f99;
            box-shadow: 0 0 6px #2b5b74 inset;
            flex-shrink: 0;
            font-size: 1.3rem;
        }

        .option-btn.correct .option-letter {
            background: #0d3d22;
            color: #b3f0c1;
            border-color: #9ae6b4;
        }

        .option-btn.wrong .option-letter {
            background: #411818;
            color: #ffb8b8;
            border-color: #e07c7c;
        }

        /* 提示卡片 */
        .tip-box {
            background: #0a1c26;
            border-left: 6px solid #c9a64b;
            border-radius: 16px;
            padding: 16px 22px;
            margin: 10px 0 20px;
            color: #cfe3f0;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: 0 0 15px #1c3f52 inset, 0 6px 0 #051019;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .tip-box::before {
            content: "💡";
            font-size: 1.6rem;
            filter: drop-shadow(0 0 6px #f0d69a);
            margin-right: 4px;
        }

        .tip-content {
            flex: 1;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            min-height: 60px;
            margin-bottom: 8px;
        }

        .feedback-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #f0d69a;
            text-shadow: 0 1px 3px black;
        }

        .next-btn {
            background: #c9a64b;
            border: none;
            border-radius: 60px;
            padding: 14px 42px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #0d1b24;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 7px 0 #6a4f1c, 0 0 15px #e6c568;
            letter-spacing: 1px;
            border: 1px solid #fae9b0;
        }

        .next-btn:hover:not(:disabled) {
            background: #e0b85c;
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #6a4f1c, 0 0 25px #ffe28b;
        }

        .next-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #4a3815;
            transform: translateY(2px);
        }

        .score-display {
            font-size: 1.3rem;
            font-weight: 600;
            color: #d4e9ff;
            background: #102b3b;
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid #4e7b8f;
            display: inline-block;
        }

        .score-display span {
            color: #fadf8a;
            font-size: 1.6rem;
            margin-left: 8px;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .reset-btn, .jump-btn {
            background: transparent;
            border: 2px solid #4e6b7a;
            border-radius: 40px;
            padding: 10px 22px;
            color: #b8d4e8;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }

        .reset-btn:hover, .jump-btn:hover {
            background: #1c3d4e;
            border-color: #8fb9d0;
            color: white;
        }

        .jump-input {
            width: 70px;
            padding: 10px 12px;
            border-radius: 40px;
            border: 2px solid #3d6b81;
            background: #0c1e2b;
            color: #eef7ff;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: 0.15s;
        }

        .jump-input:focus {
            border-color: #c9a64b;
            box-shadow: 0 0 12px #c9a64b;
        }

        .jump-input::-webkit-outer-spin-button,
        .jump-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .jump-input[type="number"] {
            -moz-appearance: textfield;
        }

        /* 移动端适配 */
        @media (max-width: 650px) {
            .game-container {
                padding: 18px 16px 22px;
                border-radius: 26px;
            }

            .question-text {
                font-size: 1.25rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .option-btn {
                padding: 14px 14px;
                font-size: 1.1rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .progress-badge {
                font-size: 0.9rem;
                padding: 6px 14px;
            }

            .next-btn {
                padding: 12px 24px;
                font-size: 1.1rem;
            }

            .tip-box {
                font-size: 1rem;
                padding: 14px 16px;
            }

            .footer-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .footer-left {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1>⚔️ 刀塔矛盾</h1>
        <div class="progress-badge">
            <span id="current-q">1</span>/<span id="total-q">100</span>
        </div>
    </div>

    <div class="question-panel">
        <div class="question-text" id="questionText">加载中...</div>
    </div>

    <div class="options-grid" id="optionsContainer">
        <!-- 选项动态生成 -->
    </div>

    <!-- 提示卡片 -->
    <div class="tip-box" id="tipBox">
        <div class="tip-content" id="tipContent">点击选项后显示克制提示。</div>
    </div>

    <div class="feedback-area">
        <div class="feedback-text" id="feedbackMsg"></div>
        <div class="score-display">得分 <span id="scoreValue">0</span></div>
    </div>

    <div class="footer-controls">
        <div class="footer-left">
            <button class="reset-btn" id="resetBtn">🔄 重新开始</button>
            <!-- 跳转控件 -->
            <input type="number" id="jumpInput" class="jump-input" min="1" max="100" value="1" placeholder="题号">
            <button class="jump-btn" id="jumpBtn">跳转</button>
        </div>
        <button class="next-btn" id="nextBtn" disabled>下一题 →</button>
    </div>
</div>

<script>
    const questions = [
        // ============ 1-10 风杖（小风杖 Eul / 大风杖 风暴之杖）/ 躲避类 ============
        { q: "剑圣开大招「无敌斩」斩你，以下哪个装备能让你完全躲避伤害？", options: ["黑皇杖", "闪烁匕首", "林肯法球", "风杖（Eul的神圣法杖）"], correct: 3, tip: "风杖吹起自己后无敌且无法被选中，无敌斩的所有斩击都无法命中你。注意无敌斩是物理攻击，BKB完全无效，林肯也挡不住（它不是指向性技能）。" },
        { q: "帕吉的「肉钩」命中你后接「肢解」，你可以用什么装备瞬间躲避后续伤害？", options: ["风杖", "先锋盾", "挑战头巾", "板甲"], correct: 0, tip: "被肉钩命中后，在帕吉开启肢解前使用风杖吹起自己，可以躲掉肢解的持续伤害和控制。" },
        { q: "敌方莉娜「神灭斩」即将命中你，以下哪个道具可以让你躲开？", options: ["魔棒", "风杖", "魂之灵瓮", "微光披风"], correct: 1, tip: "风杖可以在神灭斩弹道命中前将自己吹起，完全躲避该技能。微光披风只能提供魔抗，不能完全躲避伤害。" },
        { q: "面对军团指挥官「决斗」，队友想救你，出什么装备可以让你不被决斗？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 2, tip: "风杖可以在军团跳刀决斗前吹起你，使其无法选中你。林肯也能挡决斗，但风杖更主动。另外决斗无视减益免疫，BKB挡不住！注意：小风杖只能吹自己、敌人和分身，不能吹队友；队友若出了大风杖（风暴之杖）才可以直接把你吹起来救你。" },
        { q: "以下哪件装备可以驱散「沉默」并让你短暂无敌？", options: ["分身斧", "风杖", "散华", "天堂之戟"], correct: 1, tip: "风杖（小风杖）使用后驱散自身负面效果并进入无敌状态，是法师面对沉默的自救装备；升级成大风杖后还能对队友使用，帮队友驱散沉默。" },
        { q: "敌方血魔对你施放「割裂」，你走动会受到伤害，出什么装备可解？", options: ["风杖", "回音战刃", "韧鼓", "漩涡"], correct: 0, tip: "风杖吹起自己可以驱散割裂，落地后不再受到移动伤害。吹起期间自身无敌，不会受到割裂伤害。" },
        { q: "风杖（Eul）可以躲避以下哪个技能？", options: ["瘟疫法师大招「死神镰刀」", "斧王「淘汰之刃」", "巫医「死亡守卫」", "以上均可（在合适时机）"], correct: 3, tip: "风杖在合适时机可以躲避弹道技能和即时伤害判定，死神镰刀、淘汰之刃、死亡守卫伤害都可以用吹风规避。" },
        { q: "以下哪个英雄的技能无法被风杖躲避？", options: ["火女「神灭斩」", "宙斯「雷神之怒」", "莱恩「死亡一指」", "虚空假面「时间结界」"], correct: 3, tip: "时间结界发动瞬间即锁定范围内所有敌人，无论目标是否处于无敌状态都会被禁锢，风杖无法躲避。神灭斩、死亡一指为弹道指向技能，雷神之怒为全图无目标技能，但它们都不穿透无敌，因此风杖吹起自己都可以躲避伤害。" },
        { q: "你用风杖吹起自己，落地后以下哪个持续伤害依然会生效？", options: ["剧毒术士「毒刺」", "冥界亚龙「毒性攻击」", "末日使者「末日」", "以上都会（若已施加）"], correct: 2, tip: "风杖吹起时施加一次弱驱散，毒刺、毒性攻击这类普通负面效果都会被驱散；只有末日属于不可驱散debuff，落地后持续生效。吹起期间无敌，不会受到任何持续伤害。" },
        { q: "关于「小风杖（Eul）」和「大风杖（风暴之杖）」，以下说法正确的是？", options: ["两者都能把队友吹起来", "只有大风杖能把队友吹起来", "小风杖吹风时间更长", "小风杖冷却更短"], correct: 1, tip: "小风杖只能吹自己、敌人和自身分身，不能吹队友；升级大风杖后才能吹队友救人。两者吹风时长都是2.5秒，大风杖冷却更短（16秒 vs 23秒），且被吹目标可以控制移动方向、穿越树林地形。" },

        // ============ 11-20 黑皇杖 / 减益免疫 ============
        { q: "敌方拥有高额魔法爆发，你作为核心优先出什么？", options: ["黑皇杖", "蝴蝶", "撒旦之邪力", "金箍棒"], correct: 0, tip: "黑皇杖（BKB）提供减益免疫，免疫绝大多数魔法伤害和控制，是核心对抗魔法爆发的首选装备。" },
        { q: "黑皇杖（BKB）开启后，以下哪个技能依然可以控制你？", options: ["莱恩「妖术」", "虚空假面「时间结界」", "莉娜「神灭斩」", "以上均不能"], correct: 1, tip: "时间结界无视减益免疫，开BKB照样会被禁锢。妖术和神灭斩会被BKB完全抵挡。" },
        { q: "以下哪个技能可以无视减益免疫（BKB）？", options: ["巫医「麻痹药剂」", "莱恩「妖术」", "兽王「原始咆哮」", "莉娜「神灭斩」"], correct: 2, tip: "原始咆哮对主目标无视减益免疫。同类无视BKB效果还有谜团黑洞、猛犸两极反转、虚空时间结界、末日、全图沉默、肉钩；妖术、麻痹药剂、神灭斩会被BKB抵挡。" },
        { q: "小鱼人的「黑暗契约」的驱散效果作用在谁身上？", options: ["小鱼人自己", "周围的敌人", "他的友军", "所有单位"], correct: 0, tip: "黑暗契约只会驱散小鱼人自己身上的负面效果并延迟自身受到的伤害，不会驱散敌人或友军的任何增益。想移除敌方身上的增益，应该用否决坠饰这类指向性驱散装备。" },
        { q: "黑皇杖无法抵挡以下哪类伤害？", options: ["魔法伤害", "纯粹伤害", "物理伤害", "以上均能抵挡"], correct: 2, tip: "BKB 开启后提供减益免疫、60% 魔抗加成，并附带纯粹伤害免疫（包括反弹伤害源），因此魔法伤害与纯粹伤害都被阻挡。只有物理攻击伤害可以正常作用于 BKB 目标。" },
        { q: "敌方沉默术士开启「全领域静默」，你应该出什么应对？", options: ["黑皇杖", "风杖", "原力法杖", "微光披风"], correct: 1, tip: "全领域静默无视减益免疫，BKB 无法防止。沉默只禁止施法，不影响主动物品使用，因此被命中后可以立刻用风杖吹起自己施加基础驱散，解除沉默。这是风杖对抗 Global Silence 的核心价值。" },
        { q: "黑皇杖的持续时间会随使用次数减少，最低降到多少秒？", options: ["7秒", "5秒", "4秒", "3秒"], correct: 0, tip: "当前版本BKB初始持续9秒，每使用一次减少1秒，最低降至7秒。" },
        { q: "关于「否决坠饰」，以下说法正确的是？", options: ["可以驱散已经开启生效的BKB", "可以驱散已触发的永恒之盘护盾", "可以驱散队友身上的负面效果", "它的减益可以被敌方的强驱散（如黑暗契约）移除"], correct: 1, tip: "否决坠饰持续施加基础驱散，可以移除已触发永恒之盘护盾、微光披风、幽魂权杖这类可驱散防御增益。否决只能对敌方施放，无法驱散开启生效的BKB；否决施加的负面debuff本身不可被任何驱散（包括强驱散黑暗契约）移除。" },
        { q: "BKB开启期间，你会被大鱼人「伤害加深」影响吗？", options: ["能，因为无视减益免疫", "不能", "取决于天赋", "只有大招可以"], correct: 0, tip: "大鱼人的伤害加深是无视减益免疫的debuff，就算开启BKB依旧会被挂上，承受额外物理伤害。" },
        { q: "面对敌方黑皇杖，你应该出什么装备来克制？", options: ["金箍棒", "深渊之刃", "否决坠饰", "散失之刃"], correct: 1, tip: "深渊之刃的主动眩晕无视减益免疫，对方开BKB期间依旧可以控住。金箍棒只克制闪避；否决坠饰无法移除BKB减益免疫状态；散失属于弱驱散，对BKB无效。" },

        // ============ 21-30 林肯 / 防指向 ============
        { q: "敌方末日使者对你施放「末日」大招，你出什么装备可以抵挡？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 0, tip: "林肯法球可以抵挡末日使者的单体指向大招。注意末日可以先用小技能破林肯，需要等林肯冷却好再挡。" },
        { q: "林肯法球可以抵挡以下哪个技能？", options: ["宙斯「雷神之怒」", "谜团「黑洞」", "莱恩「妖术」", "以上均可抵挡"], correct: 2, tip: "林肯仅抵挡单体指向性技能。雷神之怒是全图无目标技能、黑洞是无目标持续技能，无法抵挡；妖术属于指向技能，可以被林肯抵挡。" },
        { q: "林肯法球无法抵挡以下哪个技能？", options: ["末日", "沉默", "黑洞", "以上均无法抵挡（范围技能）"], correct: 2, tip: "林肯只能抵挡单体指向性技能，黑洞是无目标持续范围技能，林肯无法抵挡。" },
        { q: "敌方军团指挥官对你施放「决斗」，林肯法球能抵挡吗？", options: ["能", "不能", "只有点天赋才行", "出A杖才可以"], correct: 0, tip: "林肯可以抵挡军团指挥官的决斗，让决斗无效。但军团可以先用小技能消耗掉林肯护盾。" },
        { q: "以下哪个道具可以主动给队友施加类似林肯的护盾？", options: ["微光披风", "永恒之盘", "清莲宝珠", "原力法杖"], correct: 2, tip: "清莲宝珠可以对队友主动施放，提供类似林肯的法术护盾，抵挡下一次指向性技能。" },
        { q: "林肯法球的护盾冷却时间是多少秒？", options: ["14秒", "17秒", "20秒", "12秒"], correct: 0, tip: "林肯法球的抵挡冷却为14秒，冷却期间不会生成护盾。" },
        { q: "敌方蝙蝠骑士对你施放「燃烧枷锁」，林肯可以抵挡吗？", options: ["能", "不能", "只有BKB才行", "出盘子才行"], correct: 0, tip: "林肯可以抵挡蝙蝠骑士的燃烧枷锁，拉住你的判定不会触发。蝙蝠可以先用燃油破林肯护盾。" },
        { q: "以下哪种手段可以消耗掉林肯的法术护盾？", options: ["任何单体指向技能", "只有大招", "只有物理技能", "无法消耗"], correct: 0, tip: "任意单体指向技能（包括小技能）都可以消耗林肯护盾，所以林肯很容易被廉价技能骗掉。" },
        { q: "你身上有林肯，敌方使用「阿托斯之棍」缠绕你，林肯会触发吗？", options: ["会", "不会", "只有升级阿托斯才会", "看运气"], correct: 0, tip: "阿托斯之棍是指向性技能，会触发林肯护盾，抵挡缠绕效果。" },
        { q: "以下哪件装备可以反弹指向性技能？", options: ["林肯法球", "清莲宝珠", "永世法衣", "刃甲"], correct: 1, tip: "清莲宝珠可以对自己或队友施放，提供能够反弹指向性技能的法术护盾。" },

        // ============ 31-40 刃甲 / 反伤 ============
        { q: "敌方幻影刺客打出「恩赐解脱」暴击你，你开什么装备可以反伤？", options: ["刃甲", "先锋盾", "赤红甲", "希瓦的守护"], correct: 0, tip: "刃甲开启后反弹所有来自敌方英雄的伤害，包括幻刺暴击，让攻击者受到反弹伤害。" },
        { q: "刃甲开启后，哪一类伤害会被反弹？", options: ["所有来自敌方英雄造成的伤害", "仅物理伤害", "仅魔法伤害", "仅技能伤害"], correct: 0, tip: "刃甲反弹敌方英雄来源的全部伤害：物理、魔法、纯粹伤害；非英雄单位造成的伤害不会被反弹。" },
        { q: "敌方开启刃甲攻击你，你应该怎么做？", options: ["停止攻击", "继续全力输出", "只放魔法技能", "开启BKB"], correct: 0, tip: "面对刃甲最优选择是停止攻击，等待刃甲持续时间结束再输出。" },
        { q: "刃甲主动反弹持续多少秒？", options: ["5.5秒", "4秒", "6秒", "3秒"], correct: 0, tip: "刃甲主动「伤害反弹」持续5.5秒，冷却25秒，反弹受到的伤害。" },
        { q: "下面哪个英雄技能可以无视刃甲反弹？", options: ["宙斯", "幽鬼", "冥魂大帝", "以上都不能无视（刃甲反弹英雄伤害）"], correct: 3, tip: "刃甲反弹所有英雄来源伤害，没有英雄技能可以直接无视反弹。规避方式是停止攻击。" },
        { q: "你开启刃甲，敌方开BKB攻击你，伤害会反弹吗？", options: ["会", "不会", "只有部分反弹", "看天赋"], correct: 1, tip: "刃甲反弹效果不穿透减益免疫：BKB 开启后提供纯粹伤害免疫，且明确包含'反弹伤害来源'，因此来自 BKB 用户的攻击伤害不会被反弹回去。" },
        { q: "刃甲可以反弹来自防御塔的伤害吗？", options: ["可以，主动反弹会把塔伤反弹给防御塔", "不可以", "只有升级后可以", "只有被动可以"], correct: 1, tip: "刃甲主动反弹会计算你受到的塔伤，但反弹伤害无法作用到防御塔（建筑），不会对塔造成伤害。" },
        { q: "以下哪件装备可以克制刃甲？", options: ["撒旦之邪力", "蝴蝶", "金箍棒", "撒旦或蝴蝶（吸血/闪避）"], correct: 3, tip: "撒旦吸血可以抵消反弹伤害，蝴蝶闪避减少被攻击次数；金箍棒对刃甲本身无效。最优策略是停手等待刃甲结束。" },
        { q: "刃甲反弹的伤害类型是什么？", options: ["纯粹伤害", "魔法伤害", "物理伤害", "与受到伤害来源类型一致"], correct: 3, tip: "刃甲反弹伤害类型和你受到的伤害类型一致；如果你受到物理伤害，反弹回去也是物理伤害。" },
        { q: "敌方开启刃甲，你使用「否决坠饰」能否移除反弹效果？", options: ["能", "不能", "只有部分能", "看情况"], correct: 1, tip: "刃甲主动反弹增益无法被否决驱散；面对开启刃甲的敌人，正确做法是停止攻击，等待持续时间结束。" },

        // ============ 41-50 金箍棒 / 闪避 ============
        { q: "敌方幻影刺客拥有「模糊」闪避，出什么装备克制？", options: ["金箍棒", "大炮", "蝴蝶", "代达罗斯之殇"], correct: 0, tip: "金箍棒的刺穿（克敌机先）效果让攻击不会落空，克制幻刺闪避。" },
        { q: "金箍棒的「克敌机先」效果是什么？", options: ["攻击不落空", "必定命中", "无视闪避", "以上都对"], correct: 3, tip: "金箍棒的刺穿（克敌机先）触发时攻击不落空、无视闪避并附带额外魔法伤害；触发概率80%，采用伪随机分布。" },
        { q: "以下英雄的闪避可以被金箍棒克制？", options: ["幻影刺客", "酒仙", "修补匠", "幻影刺客与酒仙"], correct: 3, tip: "金箍棒克制一切闪避来源，包括幻刺模糊、酒仙醉拳、蝴蝶闪避；修补匠没有闪避技能。" },
        { q: "金箍棒的克敌机先可以无视哪些装备闪避？", options: ["蝴蝶", "闪避护符", "蝴蝶和闪避护符都可以", "大炮"], correct: 2, tip: "金箍棒克敌机先无视所有闪避，蝴蝶、闪避护符以及天堂之戟等闪避效果均会被克制。大炮只提供暴击没有闪避。" },
        { q: "金箍棒的克敌机先触发概率是多少？", options: ["75%", "80%", "100%", "70%"], correct: 1, tip: "当前版本金箍棒的刺穿（克敌机先）触发概率为80%，采用伪随机分布。" },
        { q: "下面哪件装备提供闪避？", options: ["蝴蝶", "金箍棒", "大炮", "撒旦"], correct: 0, tip: "蝴蝶提供35%闪避，是敏捷核心常用的防御装备。" },
        { q: "对面出了金箍棒，你应该选择什么防具？", options: ["板甲", "刃甲", "希瓦的守护", "以上均可（堆护甲）"], correct: 3, tip: "金箍棒只克制闪避，对护甲没有影响。面对金箍棒堆护甲是有效的防御思路。" },
        { q: "金箍棒能否克制「天堂之戟」的缴械？", options: ["能", "不能", "升级天堂才行", "看情况"], correct: 1, tip: "金箍棒不能克制缴械，缴械效果是禁止普通攻击，和命中闪避无关。缴械属于可驱散负面，可以风杖、分身斧驱散；BKB免疫后续施加的缴械。" },
        { q: "以下哪些技能必定命中，不需要金箍棒？", options: ["冥魂大帝「冥火暴击」", "莱恩「死亡一指」", "宙斯「弧形闪电」", "以上均为指向技能，必定命中"], correct: 3, tip: "指向性技能判定不受闪避影响，必定命中。金箍棒只作用于普通攻击命中。" },
        { q: "金箍棒攻击触发克敌机先时附带什么额外伤害？", options: ["额外魔法伤害", "额外纯粹伤害", "眩晕", "额外魔法伤害+眩晕"], correct: 0, tip: "当前版本金箍棒的刺穿触发附带70点额外魔法伤害，会被魔抗减免。" },

        // ============ 51-60 分身 / 驱散 ============
        { q: "身上有沉默、减速等负面效果，用什么装备驱散？", options: ["分身斧", "黑皇杖", "风杖", "分身/吹风/BKB 都可以驱散"], correct: 3, tip: "分身斧、风杖、BKB 开启时都会施加基础驱散，都可以清除已存在的可驱散负面（沉默、减速、缴械等）。唯一不能被这些装备驱散的是末日这类不可驱散 debuff。" },
        { q: "分身斧可以驱散下面哪个技能效果？", options: ["末日", "沉默", "妖术", "沉默、妖术可驱散，末日无法驱散"], correct: 3, tip: "分身斧可以驱散沉默、减速、妖术这类大部分负面效果；末日属于不可驱散debuff，分身解不掉。" },
        { q: "以下英雄技能可以快速清理你的分身幻象？", options: ["宙斯「雷神之怒」", "斯温「风暴之锤」", "谜团「午夜凋零」", "以上均可（AOE对幻象高效）"], correct: 3, tip: "AOE伤害对幻象杀伤力很高，宙斯大招、斯温风暴之锤、谜团午夜凋零都可以快速清幻象。" },
        { q: "分身斧主动「镜像」可以躲避什么？", options: ["指向性技能", "范围技能", "持续伤害", "以上均可部分躲避"], correct: 0, tip: "分身斧开启瞬间本体短暂消失，可以躲避指向性技能；范围伤害无法依靠分身躲避。" },
        { q: "敌方开散失之刃，你的幻象会发生什么？", options: ["受到大量额外伤害", "无影响", "变成敌方单位", "爆炸"], correct: 0, tip: "散失之刃净化对幻象和召唤单位造成高额额外伤害，可以快速清理分身。" },
        { q: "什么装备可以驱散「散失之刃」的减速？", options: ["分身斧", "风杖", "BKB", "分身斧、风杖可驱散；BKB免疫新减速"], correct: 3, tip: "分身斧和风杖都可以驱散已经挂在身上的散失减速；BKB免疫敌方后续对你施加的减速。" },
        { q: "分身斧提供哪些属性？", options: ["力量、敏捷、智力", "攻击力、攻速、移速", "生命值、魔法值", "以上全部"], correct: 3, tip: "分身斧提供全属性、攻击力、攻击速度、移动速度，同时增加生命值魔法值上限。" },
        { q: "下面哪些英雄技能克制分身体系？", options: ["宙斯", "斯温", "谜团", "以上均可（AOE清幻象）"], correct: 3, tip: "宙斯、斯温、谜团都拥有强力AOE，能快速清理幻象，克制分身流。" },
        { q: "分身斧的冷却时间是多少秒？", options: ["34秒", "25秒", "30秒", "15秒"], correct: 0, tip: "分身斧冷却34秒，开启瞬间驱散自身负面，本体短暂消失可以躲避指向技能。" },
        { q: "以下哪件装备在受到敌方英雄伤害，血量低于阈值自动获得高额格挡与状态抗性？", options: ["分身斧", "风杖", "永恒之盘", "以上均可主动使用"], correct: 2, tip: "永恒之盘在生命值低于70%时受到玩家来源伤害自动触发，触发时施加一次强驱散并提供大量伤害格挡与状态抗性。" },

        // ============ 61-70 克制英雄 ============
        { q: "对面选出「幻影刺客」，哪些英雄克制她？", options: ["宙斯", "火枪", "敌法师", "以上均可（爆发/克制闪避）"], correct: 3, tip: "宙斯高额魔法爆发，火枪远程压制，敌法师削蓝，三者都可以克制幻刺。" },
        { q: "敌方是「幻影长矛手」分身体系，什么装备克制？", options: ["狂战斧", "雷神之锤", "辉耀", "以上均可（清幻象AOE）"], correct: 3, tip: "狂战斧溅射、雷神之锤连锁闪电、辉耀持续AOE都可以快速清理猴子幻象。" },
        { q: "对付冥魂大帝的大招复活，可以出什么装备限制？", options: ["否决坠饰", "散失之刃", "羊刀", "散失之刃或羊刀"], correct: 3, tip: "绝冥再生复活耗蓝，散失之刃削蓝可以阻止1/2级复活；升到3级大招后复活不耗蓝，此时只能靠羊刀硬控限制。" },
        { q: "敌方「伐木机」很肉，哪些英雄克制他？", options: ["冥魂大帝", "宙斯", "莉娜", "宙斯、莉娜（高额魔法爆发）"], correct: 3, tip: "伐木机拥有高额物理抗性，但魔抗很低，宙斯、莉娜的魔法爆发可以快速击杀。" },
        { q: "敌方幽鬼，用什么装备克制她的折射反弹？", options: ["金箍棒", "大炮", "撒旦", "撒旦（吸血抵消折射反弹）"], correct: 2, tip: "幽鬼折射会反弹伤害给攻击者，撒旦的生命吸取可以抵消反弹伤害。" },
        { q: "敌法师拥有高额魔抗和削蓝，哪些英雄克制他？", options: ["幻影刺客", "宙斯", "火枪", "以上均可（高额物理爆发）"], correct: 3, tip: "敌法师惧怕瞬间高额物理爆发，幻刺、宙斯、火枪都可以在他输出前击杀。" },
        { q: "敌方修补匠靠蓝量持续作战，什么装备克制？", options: ["散失之刃", "否决坠饰", "羊刀", "以上均可（削蓝/驱散/控制）"], correct: 3, tip: "散失削蓝，否决驱散增益，羊刀强控，三件装备都可以限制修补匠。" },
        { q: "帕吉肉钩很致命，哪些英雄可以轻松躲开钩子？", options: ["敌法师", "女王", "火猫", "以上均可（位移躲钩）"], correct: 3, tip: "敌法闪烁、女王Blink、火猫无影拳都属于位移技能，可以躲开肉钩。" },
        { q: "敌方宙斯魔法爆发强，出什么装备对抗？", options: ["挑战头巾", "微光披风", "BKB", "以上均可（魔抗/减益免疫）"], correct: 3, tip: "挑战头巾提升魔抗，微光披风增加魔抗+隐身，BKB免疫魔法伤害与控制，都能对抗宙斯。" },
        { q: "莱恩拥有大量控制技能，什么装备可以应对？", options: ["林肯", "BKB", "风杖", "以上均可（看局势选择）"], correct: 3, tip: "林肯抵挡指向控制，BKB免疫魔法控制，风杖躲避技能，三件装备都可以用来应对莱恩。" },

        // ============ 71-80 装备克制链 ============
        { q: "哪件装备克制「蝴蝶」？", options: ["金箍棒", "大炮", "撒旦", "以上均可部分克制"], correct: 0, tip: "金箍棒克敌机先无视蝴蝶闪避，是克制蝴蝶的核心装备。" },
        { q: "哪件装备克制「刃甲」？", options: ["撒旦之邪力", "蝴蝶", "金箍棒", "撒旦或蝴蝶（吸血/闪避）"], correct: 3, tip: "撒旦吸血抵消反弹伤害，蝴蝶闪避减少被攻击次数。最佳手段是停手等待刃甲结束。" },
        { q: "哪件装备在敌方开启BKB后依旧可以控住目标？", options: ["深渊之刃", "否决坠饰", "羊刀", "散失之刃"], correct: 0, tip: "深渊之刃主动眩晕无视减益免疫，对方开BKB依旧可以被控。" },
        { q: "哪些装备可以克制「林肯法球」？", options: ["散失之刃", "阿托斯之棍", "否决坠饰", "以上均可（指向技能消耗林肯护盾）"], correct: 3, tip: "散失主动净化、阿托斯缠绕、否决主动都是指向技能，都可以消耗林肯的法术护盾。" },
        { q: "敌方给自己吹风上天，下面做法正确的是？", options: ["散失驱散吹风", "羊刀变羊", "否决驱散吹风", "等落地再接控制"], correct: 3, tip: "吹起期间单位无敌不可选中，任何指向装备、技能都无法选中他，只能等落地。" },
        { q: "哪件装备克制「永恒之盘」？", options: ["否决坠饰", "散失之刃", "羊刀", "以上均可"], correct: 0, tip: "否决坠饰需要提前对目标施放挂上锁闭，目标触发永恒之盘时会被压制，盘子无法生效。" },

        { q: "哪些英雄技能可以克制「闪烁匕首」？", options: ["宙斯", "斯温", "帕吉", "以上均可（伤害/钩子打断跳刀）"], correct: 3, tip: "只要受到敌方英雄伤害就会触发跳刀冷却；宙斯、斯温技能打伤害可以打断跳刀；帕吉肉钩直接拉人。" },

        { q: "哪件装备可以让你短暂虚无，免疫所有物理攻击？", options: ["幽魂权杖", "微光披风", "挑战头巾", "先锋盾"], correct: 0, tip: "幽魂权杖主动进入虚无状态，免疫物理伤害，但受到的魔法伤害加深40%。" },
        { q: "下面哪些英雄技能可以克制幻象分身？", options: ["宙斯", "斯温「风暴之锤」", "谜团", "以上均可（AOE清幻象）"], correct: 3, tip: "宙斯大招、斯温风暴之锤、谜团AOE都可以快速清理幻象分身。" },
        { q: "哪件装备克制闪避效果？", options: ["金箍棒", "大炮", "蝴蝶", "以上均可（必中）"], correct: 0, tip: "金箍棒克敌机先无视闪避，是克制闪避的核心装备。" },
        { q: "哪些手段可以克制治疗效果？", options: ["冰魂大招", "末日", "魂之灵瓮", "以上均可（禁疗/减疗）"], correct: 3, tip: "冰魂大招完全禁止生命恢复；末日禁止目标治疗；魂之灵瓮大幅降低治疗效果。" },
        { q: "哪件装备克制吸血效果？", options: ["冰魂大招", "希瓦的守护", "羊刀", "紫怨"], correct: 0, tip: "冰魂大招冰霜诅咒禁用所有生命恢复与吸血，是克制吸血的核心手段。" }
    ];

    // ---------- 状态 ----------
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let correctOptionIndex = -1;

    // DOM 元素
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const currentQSpan = document.getElementById('current-q');
    const totalQSpan = document.getElementById('total-q');
    const scoreValueSpan = document.getElementById('scoreValue');
    const tipContent = document.getElementById('tipContent');
    // 跳转元素
    const jumpInput = document.getElementById('jumpInput');
    const jumpBtn = document.getElementById('jumpBtn');

    // 初始化显示总题数
    totalQSpan.textContent = questions.length;
    jumpInput.max = questions.length;
    jumpInput.value = 1;

    // ---------- 加载题目（完全保持选项数组原始顺序） ----------
    function loadQuestion(index) {
        // 边界保护
        if (index < 0) index = 0;
        if (index >= questions.length) index = questions.length - 1;
        currentIndex = index;

        answered = false;
        nextBtn.disabled = true;
        feedbackMsg.textContent = '';
        tipContent.textContent = '点击选项后显示克制提示。';

        const qData = questions[index];
        if (!qData) return;

        questionText.textContent = qData.q;

        // 直接使用原数组顺序，不进行随机打乱
        const options = qData.options;
        correctOptionIndex = qData.correct;

        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];

        options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.setAttribute('data-index', idx);
            btn.innerHTML = `<span class="option-letter">${letters[idx]}</span>${optText}`;
            btn.addEventListener('click', () => handleOptionClick(idx, btn));
            optionsContainer.appendChild(btn);
        });

        currentQSpan.textContent = index + 1;
        scoreValueSpan.textContent = score;
        // 同步跳转输入框的值
        jumpInput.value = index + 1;
    }

    // 处理选项点击
    function handleOptionClick(selectedIdx, btnElement) {
        if (answered) return;

        const allOptions = document.querySelectorAll('.option-btn');
        const isCorrect = (selectedIdx === correctOptionIndex);

        allOptions.forEach(btn => btn.classList.add('disabled'));

        allOptions.forEach((btn, idx) => {
            if (idx === correctOptionIndex) {
                btn.classList.add('correct');
            } else if (idx === selectedIdx && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score++;
            scoreValueSpan.textContent = score;
            feedbackMsg.textContent = '✅ 正确！ 克制关系掌握得不错。';
        } else {
            feedbackMsg.textContent = `❌ 错误！ 正确答案是 ${String.fromCharCode(65 + correctOptionIndex)}。`;
        }

        const currentQ = questions[currentIndex];
        if (currentQ && currentQ.tip) {
            tipContent.textContent = currentQ.tip;
        } else {
            tipContent.textContent = '（本题暂无额外提示）';
        }

        answered = true;
        nextBtn.disabled = false;
    }

    // 下一题
    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        } else {
            if (currentIndex === questions.length - 1 && answered) {
                if (nextBtn.disabled) return;
                questionText.textContent = `🎉 恭喜你完成全部 ${questions.length} 题！ 最终得分: ${score} / ${questions.length}`;
                optionsContainer.innerHTML = '';
                feedbackMsg.textContent = score >= 80 ? '🌟 大神！你对Dota2克制关系了如指掌。' :
                    score >= 50 ? '👍 还不错，再巩固一下细节吧。' : '📘 多看看装备和技能说明，再来挑战！';
                tipContent.textContent = '克制之道，在于知己知彼。多实践，多思考，你也能成为刀塔智者。';
                nextBtn.disabled = true;
                currentQSpan.textContent = questions.length;
                jumpInput.value = questions.length;
            } else {
                if (!answered) return;
            }
        }
    }

    // 重置游戏
    function resetGame() {
        currentIndex = 0;
        score = 0;
        answered = false;
        scoreValueSpan.textContent = '0';
        loadQuestion(0);
        feedbackMsg.textContent = '';
        tipContent.textContent = '点击选项后显示克制提示。';
        jumpInput.value = 1;
    }

    // 跳转到指定题目
    function jumpToQuestion() {
        let target = parseInt(jumpInput.value, 10);
        if (isNaN(target)) {
            target = 1;
        }
        // 范围限制
        if (target < 1) target = 1;
        if (target > questions.length) target = questions.length;
        jumpInput.value = target;
        // 重置答题状态并加载题目，跳转后答对不计分
        currentIndex = target - 1;
        jumpIgnoreScore = true;
        loadQuestion(target - 1);
    }

    // 全局标志：跳转后是否忽略计分
    let jumpIgnoreScore = false;

    // 重新定义handleOptionClick以支持跳转忽略计分
    const originalHandleOptionClick = handleOptionClick;
    handleOptionClick = function(selectedIdx, btnElement) {
        if (answered) return;

        const allOptions = document.querySelectorAll('.option-btn');
        const isCorrect = (selectedIdx === correctOptionIndex);

        allOptions.forEach(btn => btn.classList.add('disabled'));

        allOptions.forEach((btn, idx) => {
            if (idx === correctOptionIndex) {
                btn.classList.add('correct');
            } else if (idx === selectedIdx && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            // 如果跳转来的，忽略计分
            if (!jumpIgnoreScore) {
                score++;
                scoreValueSpan.textContent = score;
            }
            feedbackMsg.textContent = '✅ 正确！ 克制关系掌握得不错。' + (jumpIgnoreScore ? '（跳转模式，不计分）' : '');
        } else {
            feedbackMsg.textContent = `❌ 错误！ 正确答案是 ${String.fromCharCode(65 + correctOptionIndex)}。` + (jumpIgnoreScore ? '（跳转模式，不计分）' : '');
        }

        const currentQ = questions[currentIndex];
        if (currentQ && currentQ.tip) {
            tipContent.textContent = currentQ.tip;
        } else {
            tipContent.textContent = '（本题暂无额外提示）';
        }

        answered = true;
        nextBtn.disabled = false;
    };

    // 修改nextQuestion，在跳转时清除标志
    const originalNextQuestion = nextQuestion;
    nextQuestion = function() {
        jumpIgnoreScore = false; // 正常下一题后恢复计分
        originalNextQuestion();
    };

    // 修改resetGame，清除标志
    const originalResetGame = resetGame;
    resetGame = function() {
        jumpIgnoreScore = false;
        originalResetGame();
    };

    // 初始化
    function init() {
        loadQuestion(0);
        nextBtn.addEventListener('click', nextQuestion);
        resetBtn.addEventListener('click', resetGame);
        // 跳转按钮事件
        jumpBtn.addEventListener('click', jumpToQuestion);
        // 输入框回车跳转
        jumpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                jumpToQuestion();
            }
        });
    }

    // 覆盖全局函数
    window.handleOptionClick = handleOptionClick;
    window.nextQuestion = nextQuestion;
    window.resetGame = resetGame;

    // 启动
    init();
</script>
