<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀塔矛盾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b1a2a;
            background-image: radial-gradient(circle at 20% 30%, #1b3b4f 0%, #07131f 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #0f212f;
            border-radius: 36px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #2a4a5a inset, 0 0 15px #3e6a7e;
            padding: 24px 30px 30px;
            border: 1px solid #4e7b8f;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            color: #c2e0f0;
            text-shadow: 0 2px 4px black;
            padding: 0 8px;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e8d9b0, #b9a577);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px black);
        }

        .progress-badge {
            background: #162f3f;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 600;
            border: 1px solid #4e7b8f;
            box-shadow: 0 0 8px #1e4b5e inset;
            font-size: 1.1rem;
            color: #b5d9ec;
        }

        .progress-badge span {
            color: #f0d69a;
            font-size: 1.4rem;
            margin-right: 6px;
        }

        .question-panel {
            background: #102b3b;
            border-radius: 30px;
            padding: 26px 28px;
            border: 1px solid #3d6b81;
            box-shadow: 0 8px 0 #051019, 0 0 25px #1d4054 inset;
            margin-bottom: 20px;
            min-height: 140px;
            display: flex;
            align-items: center;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #eef7ff;
            line-height: 1.4;
            text-shadow: 0 2px 5px black;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .option-btn {
            background: #1a3345;
            border: 2px solid #35657e;
            border-radius: 18px;
            padding: 18px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #d7ecfa;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #0b1c28, 0 0 0 1px #2e5268 inset;
            letter-spacing: 0.3px;
        }

        .option-btn:hover:not(.disabled) {
            background: #234f66;
            border-color: #63a5c2;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b1c28, 0 0 12px #5b9cbb;
        }

        .option-btn.correct {
            background: #1a5e3a;
            border-color: #9ae6b4;
            color: white;
            box-shadow: 0 0 18px #3fcc7a, 0 6px 0 #0a2e1d;
        }

        .option-btn.wrong {
            background: #6e2a2a;
            border-color: #e07c7c;
            color: #ffe2e2;
            box-shadow: 0 0 18px #d65454, 0 6px 0 #3d1515;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.8;
            pointer-events: none;
        }

        .option-letter {
            background: #0a1a24;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #b9d9f0;
            border: 1px solid #517f99;
            box-shadow: 0 0 6px #2b5b74 inset;
            flex-shrink: 0;
            font-size: 1.3rem;
        }

        .option-btn.correct .option-letter {
            background: #0d3d22;
            color: #b3f0c1;
            border-color: #9ae6b4;
        }

        .option-btn.wrong .option-letter {
            background: #411818;
            color: #ffb8b8;
            border-color: #e07c7c;
        }

        /* 提示卡片 —— 新增 */
        .tip-box {
            background: #0a1c26;
            border-left: 6px solid #c9a64b;
            border-radius: 16px;
            padding: 16px 22px;
            margin: 10px 0 20px;
            color: #cfe3f0;
            font-size: 1.1rem;
            line-height: 1.5;
            box-shadow: 0 0 15px #1c3f52 inset, 0 6px 0 #051019;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .tip-box::before {
            content: "💡";
            font-size: 1.6rem;
            filter: drop-shadow(0 0 6px #f0d69a);
            margin-right: 4px;
        }

        .tip-content {
            flex: 1;
        }

        .feedback-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            min-height: 60px;
            margin-bottom: 8px;
        }

        .feedback-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #f0d69a;
            text-shadow: 0 1px 3px black;
        }

        .next-btn {
            background: #c9a64b;
            border: none;
            border-radius: 60px;
            padding: 14px 42px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #0d1b24;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 7px 0 #6a4f1c, 0 0 15px #e6c568;
            letter-spacing: 1px;
            border: 1px solid #fae9b0;
        }

        .next-btn:hover:not(:disabled) {
            background: #e0b85c;
            transform: translateY(-2px);
            box-shadow: 0 9px 0 #6a4f1c, 0 0 25px #ffe28b;
        }

        .next-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #4a3815;
            transform: translateY(2px);
        }

        .score-display {
            font-size: 1.3rem;
            font-weight: 600;
            color: #d4e9ff;
            background: #102b3b;
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid #4e7b8f;
            display: inline-block;
        }

        .score-display span {
            color: #fadf8a;
            font-size: 1.6rem;
            margin-left: 8px;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid #4e6b7a;
            border-radius: 40px;
            padding: 10px 26px;
            color: #b8d4e8;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .reset-btn:hover {
            background: #1c3d4e;
            border-color: #8fb9d0;
            color: white;
        }

        /* 移动端适配 */
        @media (max-width: 650px) {
            .game-container {
                padding: 18px 16px 22px;
                border-radius: 26px;
            }

            .question-text {
                font-size: 1.25rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .option-btn {
                padding: 14px 14px;
                font-size: 1.1rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .progress-badge {
                font-size: 0.9rem;
                padding: 6px 14px;
            }

            .next-btn {
                padding: 12px 24px;
                font-size: 1.1rem;
            }

            .tip-box {
                font-size: 1rem;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>⚔️ 刀塔矛盾</h1>
            <div class="progress-badge">
                <span id="current-q">1</span>/<span id="total-q">100</span>
            </div>
        </div>

        <div class="question-panel">
            <div class="question-text" id="questionText">加载中...</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <!-- 选项动态生成 -->
        </div>

        <!-- 提示卡片（无论对错都显示） -->
        <div class="tip-box" id="tipBox">
            <div class="tip-content" id="tipContent">点击选项后显示克制提示。</div>
        </div>

        <div class="feedback-area">
            <div class="feedback-text" id="feedbackMsg"></div>
            <div class="score-display">得分 <span id="scoreValue">0</span></div>
        </div>

        <div class="footer-controls">
            <button class="reset-btn" id="resetBtn">🔄 重新开始</button>
            <button class="next-btn" id="nextBtn" disabled>下一题 →</button>
        </div>
    </div>

    <script>
        const questions = [
    // ============ 1-10 风杖（小风杖 Eul / 大风杖 风暴之杖）/ 躲避类 ============
    { q: "剑圣开大招「无敌斩」斩你，以下哪个装备能让你完全躲避伤害？", options: ["黑皇杖", "闪烁匕首", "林肯法球", "风杖（Eul的神圣法杖）"], correct: 3, tip: "风杖吹起自己后无敌且无法被选中，无敌斩的所有斩击都无法命中你。注意无敌斩是物理攻击，BKB完全无效，林肯也挡不住（它不是指向性技能）。" },
    { q: "帕吉的「肉钩」命中你后接「肢解」，你可以用什么装备瞬间躲避后续伤害？", options: ["风杖", "先锋盾", "挑战头巾", "板甲"], correct: 0, tip: "被肉钩命中后，在帕吉开启肢解前使用风杖吹起自己，可以躲掉肢解的持续伤害和控制。" },
    { q: "敌方莉娜「神灭斩」即将命中你，以下哪个道具可以让你躲开？", options: ["魔棒", "风杖", "魂之灵瓮", "微光披风"], correct: 1, tip: "风杖可以在神灭斩弹道命中前将自己吹起，完全躲避该技能。微光披风只能提供魔抗，不能完全躲避。" },
    { q: "面对军团指挥官「决斗」，队友想救你，出什么装备可以让你不被决斗？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 2, tip: "风杖可以在军团跳刀决斗前吹起自己，使其无法选中你。林肯也能挡决斗，但风杖更主动。另外决斗无视减益免疫，BKB挡不住！注意：小风杖只能吹自己，队友若出了大风杖（风暴之杖）也可以直接把你吹起来救你。" },
    { q: "以下哪件装备可以驱散「沉默」并让你短暂无敌？", options: ["分身斧", "风杖", "散华", "天堂之戟"], correct: 1, tip: "风杖（小风杖）使用后驱散自身负面效果并进入无敌状态，是法师面对沉默的常见自救装；升级成大风杖后还能对队友使用，帮队友驱散沉默。" },
    { q: "敌方血魔对你施放「割裂」，你走动会受到伤害，出什么装备可解？", options: ["风杖", "回音战刃", "韧鼓", "漩涡"], correct: 0, tip: "风杖吹起自己可以驱散割裂，落地后不再受到移动伤害。注意吹起期间不会掉血。" },
    { q: "风杖（Eul）可以躲避以下哪个技能？", options: ["瘟疫法师大招「死神镰刀」", "斧王「淘汰之刃」", "巫医「死亡守卫」", "以上均可（在合适时机）"], correct: 3, tip: "风杖在合适的时机可以躲掉弹道技能和即时伤害判定，死神镰刀、淘汰之刃、死亡守卫伤害都可以用吹风规避。" },
    { q: "以下哪个英雄的技能无法被风杖躲避？", options: ["火女「神灭斩」", "宙斯「雷神之怒」", "莱恩「死亡之指」", "虚空假面「时间结界」"], correct: 1, tip: "宙斯的大招「雷神之怒」是全图即时伤害，没有弹道，风杖无法躲避。神灭斩和死亡之指有弹道，可以吹起躲掉。" },
    { q: "你用风杖吹起自己，落地后以下哪个持续伤害依然会生效？", options: ["剧毒术士「毒刺」", "冥界亚龙「毒性攻击」", "末日使者「末日」", "以上都会（若已施加）"], correct: 2, tip: "风杖吹起时会施加一次基础弱驱散，毒刺、毒性攻击这类普通负面效果都会被驱散；只有末日无法被驱散，落地后依然持续。吹起期间你是无敌的，任何持续伤害都不会扣血。" },
    { q: "关于「小风杖（Eul）」和「大风杖（风暴之杖）」，以下说法正确的是？", options: ["两者都能把队友吹起来", "只有大风杖能把队友吹起来", "小风杖的吹风时间更长", "小风杖的冷却更短"], correct: 1, tip: "小风杖只能吹自己、敌人和自己的分身，不能吹队友；升级成大风杖后才能吹队友救人。两者吹风时间都是2.5秒，但大风杖冷却更短（16秒 vs 23秒），且自己被吹期间还能操控移动方向、穿越树林和地形。" },
    // ============ 11-20 黑皇杖 / 减益免疫（原魔法免疫） ============
    { q: "敌方拥有高魔法爆发，你作为核心应该优先出什么？", options: ["黑皇杖", "蝴蝶", "撒旦之邪力", "金箍棒"], correct: 0, tip: "黑皇杖（BKB）提供减益免疫，能免疫绝大多数魔法伤害和控制，是核心对抗高魔法爆发的不二之选。" },
    { q: "黑皇杖（BKB）开启后，以下哪个技能依然能控制你？", options: ["莱恩「妖术」", "虚空假面「时间结界」", "莉娜「神灭斩」", "以上均不能"], correct: 1, tip: "时间结界无视减益免疫，开BKB照样被控住。妖术和神灭斩则会被BKB完全挡住。" },
    { q: "以下哪个技能可以无视减益免疫（BKB）？", options: ["巫医「麻痹药剂」", "莱恩「妖术」", "兽王「原始咆哮」", "莉娜「神灭斩」"], correct: 2, tip: "原始咆哮对主目标无视减益免疫。同样无视减益免疫的还有谜团黑洞、猛犸两极反转、虚空时间结界、末日、全球沉默、肉钩等；妖术和麻痹药剂会被BKB挡住。" },
    { q: "面对敌方小鱼人「黑暗契约」的驱散，你出什么装备可以不被驱散？", options: ["黑皇杖", "林肯法球", "风杖", "永恒之盘"], correct: 0, tip: "BKB的减益免疫可以防止大部分驱散效果，包括小鱼人的黑暗契约。注意BKB不能防无视减益免疫的驱散。" },
    { q: "黑皇杖无法抵挡以下哪类伤害？", options: ["魔法伤害", "纯粹伤害", "物理伤害", "以上均能抵挡"], correct: 2, tip: "BKB的减益免疫能挡住绝大多数魔法伤害，当前版本开启期间甚至对纯粹伤害免疫，但永远挡不住普通攻击的物理伤害——这也是物理核心不怕BKB的原因。" },
    { q: "敌方沉默术士开启「全领域静默」，你应该出什么应对？", options: ["黑皇杖", "风杖", "原力法杖", "微光披风"], correct: 1, tip: "全领域静默会无视减益免疫，BKB根本挡不住！风杖可以在大招生效时吹起自己躲避，或者被沉默后吹起自己驱散。" },
    { q: "黑皇杖的持续时间会随使用次数减少，最低降至多少秒？", options: ["7秒", "5秒", "4秒", "3秒"], correct: 0, tip: "当前版本BKB初始持续9秒，每次使用减少1秒，最低降至7秒。（老版本是10秒起步、最低4~5秒，别记混了。）" },
    { q: "关于否决坠饰与黑皇杖（BKB），下面描述正确的是？", options: ["否决可以驱散已经开启生效的BKB", "散失之刃主动可以驱散BKB", "提前给目标挂上否决，对方再开BKB时，否决的锁闭可以压制BKB效果", "没有任何手段可以克制BKB"], correct: 2, tip: "否决坠饰不能驱散已经生效的BKB。若目标身上已经挂着否决锁闭debuff，此时对方再开启BKB，BKB的减益免疫效果会被否决锁闭压制，失效。散失是弱驱散，无法处理BKB增益。" },
    { q: "BKB开启期间，你能被「大鱼人」的「伤害加深」影响吗？", options: ["能，因为无视减益免疫", "不能", "取决于天赋", "只有大招能"], correct: 0, tip: "大鱼人的伤害加深是无视减益免疫的，即使开启BKB依然会被施加，并受到额外物理伤害。（7.41f只削了鱼人碎击的伤害，腐蚀雾机制不变。）" },
    { q: "面对敌方黑皇杖，你应该出什么装备来克制？", options: ["金箍棒", "深渊之刃", "否决坠饰", "深渊之刃或否决坠饰（看打法）"], correct: 3, tip: "深渊之刃主动眩晕无视减益免疫；否决需要提前挂目标，对方开BKB时才能锁闭压制BKB增益。金箍棒只克制闪避，对BKB无效。" },
    // ============ 21-30 林肯 / 防指向 ============
    { q: "敌方末日使者对你施放大招「末日」，你出什么装备可以抵挡？", options: ["林肯法球", "黑皇杖", "风杖", "永恒之盘"], correct: 0, tip: "林肯法球可以抵挡末日使者的单体指向大招。注意如果末日先用其他技能破林肯，则需要等林肯冷却后再挡。" },
    { q: "林肯法球可以抵挡以下哪个技能？", options: ["宙斯「雷神之怒」", "谜团「黑洞」", "莱恩「妖术」", "以上均可抵挡"], correct: 2, tip: "林肯只抵挡单体指向性技能。雷神之怒是全图无目标技能、黑洞是无目标持续技能，都无法被林肯抵挡；妖术是指向性技能，可以被挡掉。" },
    { q: "林肯法球无法抵挡以下哪个技能？", options: ["末日", "沉默", "黑洞", "以上均无法抵挡（范围技）"], correct: 2, tip: "林肯只能抵挡单体指向性技能，黑洞是无目标范围持续技能，林肯无法抵挡。" },
    { q: "敌方军团指挥官「决斗」你，林肯能帮你抵挡吗？", options: ["能", "不能", "只有点天赋能", "出A杖能"], correct: 0, tip: "林肯可以抵挡军团指挥官的决斗，使其决斗无效。但注意军团可能先用其他技能破林肯。" },
    { q: "以下哪个道具可以主动给队友套上类似林肯的屏障？", options: ["微光披风", "永恒之盘", "清莲宝珠", "原力法杖"], correct: 2, tip: "清莲宝珠可以主动对队友使用，提供一个类似林肯的法术屏障，抵挡下一个指向性技能。" },
    { q: "林肯法球的冷却时间是多少？", options: ["14秒", "17秒", "20秒", "12秒"], correct: 0, tip: "林肯法球的抵挡冷却时间为14秒，期间无法再次触发抵挡效果。" },
    { q: "敌方蝙蝠骑士「枷锁」你，林肯能挡吗？", options: ["能", "不能", "只有BKB能", "出盘子能"], correct: 0, tip: "林肯可以抵挡蝙蝠骑士的枷锁，使其无法拉住你。但蝙蝠可能先用燃油破林肯。" },
    { q: "以下哪个技能可以瞬间消耗掉林肯的屏障？", options: ["任何指向性技能", "只有大招", "只有物理技能", "无法消耗"], correct: 0, tip: "任何单体指向性技能（包括小技能）都可以消耗林肯的屏障，所以林肯有时会被廉价技能骗掉。" },
    { q: "你出了林肯，敌方使用「阿托斯之棍」困住你，林肯会触发吗？", options: ["会", "不会", "只有阿托斯升级后会", "看运气"], correct: 0, tip: "阿托斯之棍是指向性技能，林肯会触发并抵挡其缠绕效果。" },
    { q: "以下哪件装备可以反弹指向性技能？", options: ["林肯法球", "清莲宝珠", "永世法衣", "刃甲"], correct: 1, tip: "清莲宝珠可以主动对队友或自己使用，提供一个可以反弹指向性技能的法术屏障。" },
    // ============ 31-40 刃甲 / 反伤 ============
    { q: "敌方幻影刺客开「恩赐解脱」暴击你，你开什么装备可以反伤？", options: ["刃甲", "先锋盾", "赤红甲", "希瓦的守护"], correct: 0, tip: "刃甲开启后可以反弹所有来自敌方英雄的伤害，包括幻影刺客的暴击，让她自食其果。" },
    { q: "刃甲开启后，以下哪种伤害会被反弹？", options: ["所有来自敌方英雄的伤害", "仅物理伤害", "仅魔法伤害", "仅技能伤害"], correct: 0, tip: "刃甲反弹所有来自敌方英雄的伤害，包括物理、魔法和纯粹伤害，但不对非英雄单位生效。" },
    { q: "面对敌方刃甲，你应该怎么做？", options: ["停止攻击", "继续疯狂输出", "使用魔法伤害", "开BKB"], correct: 0, tip: "面对刃甲最明智的做法是停止攻击，等待刃甲持续时间结束再输出。" },
    { q: "刃甲的主动效果持续多少秒？", options: ["5.5秒", "4秒", "6秒", "3秒"], correct: 0, tip: "刃甲主动「伤害反弹」持续5.5秒，冷却25秒，反弹85%所受伤害。掌握好时机开启可以反弹大量伤害。" },
    { q: "以下哪个英雄的技能可以无视刃甲反弹？", options: ["宙斯", "幽鬼", "冥魂大帝", "以上均不能无视（刃甲反弹英雄伤害）"], correct: 3, tip: "刃甲反弹所有来自英雄的伤害，没有英雄可以完全无视刃甲反弹。但可以通过不攻击来规避。" },
    { q: "你开刃甲，敌方开BKB打你，伤害会反弹吗？", options: ["会", "不会", "只有部分会", "看天赋"], correct: 0, tip: "刃甲的反弹效果无视减益免疫，即使敌方开启BKB，伤害依然会被反弹。" },
    { q: "刃甲可以反弹来自防御塔的伤害吗？", options: ["可以反弹伤害，但不会反弹给防御塔", "不可以", "只有升级后可以", "仅对英雄有效"], correct: 1, tip: "刃甲反弹仅对**敌方英雄造成的伤害生效**。防御塔、小兵、召唤物的攻击不会触发刃甲反弹，塔伤完全不会被反弹。" },
    { q: "以下哪件装备可以克制刃甲？", options: ["撒旦之邪力", "蝴蝶", "金箍棒", "撒旦或蝴蝶（吸血/闪避）"], correct: 3, tip: "撒旦的吸血可以抵消反弹伤害，蝴蝶的闪避可以减少被击中；金箍棒对刃甲本身无效。最佳策略是停手。" },
    { q: "刃甲反弹的伤害类型是什么？", options: ["纯粹伤害", "魔法伤害", "物理伤害", "与来源相同"], correct: 3, tip: "刃甲反弹的伤害类型与来源伤害类型相同，如果来源是物理伤害，反弹的也是物理伤害。" },
    { q: "敌方开刃甲，你用「否决坠饰」能驱散反弹效果吗？", options: ["能", "不能", "只有部分能", "看情况"], correct: 1, tip: "刃甲主动反弹增益**不可驱散**，否决坠饰的强驱散无法移除刃甲反弹。克制刃甲最好办法是暂停攻击，等待持续时间结束。" },
    // ============ 41-50 金箍棒 / 闪避 ============
    { q: "敌方幻影刺客有「模糊」闪避，你出什么装备克制？", options: ["金箍棒", "大炮", "蝴蝶", "代达罗斯之殇"], correct: 0, tip: "金箍棒的克敌机先效果可以让你的攻击不落空，完全克制幻影刺客的闪避。" },
    { q: "金箍棒的「克敌机先」效果是什么？", options: ["攻击不落空", "必中", "无视闪避", "以上都对"], correct: 3, tip: "金箍棒提供100%概率的克敌机先，使攻击必定命中，无视任何闪避效果。" },
    { q: "以下哪个英雄的闪避可以被金箍棒克制？", options: ["幻影刺客", "酒仙", "修补匠", "幻影刺客与酒仙"], correct: 3, tip: "金箍棒可以克制所有来源的闪避，包括幻影刺客的模糊、酒仙的醉拳、蝴蝶的闪避等；修补匠没有闪避技能。" },
    { q: "金箍棒的克敌机先可以无视以下哪些装备的闪避？", options: ["蝴蝶", "闪避护符", "蝴蝶和闪避护符都可以", "大炮"], correct: 2, tip: "金箍棒的克敌机先无视一切闪避，蝴蝶和闪避护符都被它克制。大炮提供暴击不提供闪避，与命中无关。（天堂之戟在7.38重做后已改为伤害格挡，同样没有闪避了。）" },
    { q: "金箍棒的克敌机先触发概率是多少？", options: ["75%", "80%", "100%", "70%"], correct: 2, tip: "金箍棒的克敌机先触发概率是100%，每次攻击都必定命中。" },
    { q: "以下哪件装备提供闪避？", options: ["蝴蝶", "金箍棒", "大炮", "撒旦"], correct: 0, tip: "蝴蝶提供35%的闪避，是敏捷核心常见的防御装备。（7.41e把蝴蝶的敏捷从35调整为30、攻击力从25调整为30，但闪避不变。）" },
    { q: "面对敌方金箍棒，你应该出什么防具？", options: ["板甲", "刃甲", "希瓦的守护", "以上均可（堆护甲）"], correct: 3, tip: "金箍棒只克制闪避，不克制护甲。面对金箍棒应该堆护甲，如板甲、希瓦的守护等。" },
    { q: "金箍棒能克制「天堂之戟」的缴械吗？", options: ["能", "不能", "只有升级后能", "看情况"], correct: 1, tip: "金箍棒不能克制缴械，缴械是让你无法攻击，与命中无关。缴械是可驱散的负面效果，可以用风杖、分身斧驱散掉；BKB则能免疫后续的缴械（但不能解掉已生效的）。" },
    { q: "以下哪个技能是必中的，不需要金箍棒？", options: ["冥魂大帝的「冥火暴击」", "火枪的「爆头」", "宙斯的「弧形闪电」", "以上技能均为技能必中"], correct: 3, tip: "所有技能都是必中的，不需要金箍棒。金箍棒只影响普通攻击的命中。" },
    { q: "金箍棒的攻击附带额外什么伤害？", options: ["额外魔法伤害", "额外纯粹伤害", "眩晕", "额外魔法伤害+眩晕"], correct: 1, tip: "当前版本金箍棒的克敌机先攻击附带额外纯粹伤害；**不再有猛击眩晕效果**（眩晕是远古版本机制，现已删除）。" },
    // ============ 51-60 分身 / 驱散 ============
    { q: "敌方有沉默、减速等负面效果，你出什么装备可以驱散？", options: ["分身斧", "黑皇杖", "风杖", "分身/吹风可驱散，BKB只能免疫新负面"], correct: 3, tip: "分身斧可以驱散大部分负面效果，风杖可以吹起驱散；BKB提供减益免疫，只能阻止新负面施加，**无法驱散身上已经存在的负面**。" },
    { q: "分身斧可以驱散以下哪个技能？", options: ["末日", "沉默", "妖术", "沉默、妖术可驱散，末日无法驱散"], correct: 3, tip: "分身斧可以驱散沉默、减速、妖术等大部分负面效果，但无法驱散末日这类不可驱散的强力效果。" },
    { q: "以下哪个英雄的技能可以瞬间清掉你的分身？", options: ["宙斯「雷神之怒」", "斯温「风暴之拳」", "谜团「午夜凋零」", "以上均可（AOE对幻象高效）"], correct: 3, tip: "任何AOE技能都可以快速清掉幻象，宙斯、斯温、谜团等英雄的技能对幻象有奇效。" },
    { q: "分身斧的主动技能「镜像」能躲避什么？", options: ["指向性技能", "范围技能", "持续伤害", "以上均可部分躲避"], correct: 0, tip: "分身斧使用瞬间本体短暂消失，可以躲避指向性技能。但无法躲避范围技能。" },
    { q: "面对敌方散失之刃，你的分身会怎样？", options: ["受到大量额外伤害", "无影响", "变成敌人", "爆炸"], correct: 0, tip: "散失之刃的净化会对幻象和召唤物造成大量额外伤害，能快速清掉分身，但并不是「瞬间消灭」；真正秒幻象的是宙斯大招这类范围爆发。" },
    { q: "以下哪个装备可以驱散「散失之刃」的减速？", options: ["分身斧", "风杖", "BKB", "分身斧、风杖可驱散；BKB免疫新减速"], correct: 3, tip: "分身斧、风杖的弱驱散可以移除已挂上的散失减速；BKB减益免疫可以阻止敌方对你施加新的散失减速。" },
    { q: "分身斧提供什么属性？", options: ["力量、敏捷、智力", "攻击力、攻速、移速", "生命、魔法", "以上均有"], correct: 3, tip: "分身斧提供全面的属性加成，包括力量、敏捷、智力、攻击力、攻速和移速。" },
    { q: "以下哪个英雄的技能可以克制分身系？", options: ["宙斯", "斯温", "谜团", "以上均可（AOE清幻象）"], correct: 3, tip: "宙斯、斯温、谜团等拥有强力AOE技能的英雄可以快速清掉幻象，克制分身系。" },
    { q: "分身斧的冷却时间是多少？", options: ["34秒", "25秒", "30秒", "15秒"], correct: 0, tip: "分身斧的冷却时间为34秒，使用时会驱散自身负面效果，镜像分割瞬间本体短暂消失，可以躲掉指向性技能。" },
    { q: "以下哪件装备可以让你在受到英雄伤害时自动获得伤害格挡与状态抗性？", options: ["分身斧", "风杖", "永恒之盘", "以上均可主动使用"], correct: 2, tip: "永恒之盘在你受到英雄伤害、生命值低于阈值时自动触发，提供一段时间大量伤害格挡与状态抗性，不只针对指向性技能，是防秒杀神器。**否决不能驱散已经触发生效的盘子护盾。**" },
    // ============ 61-70 克制英雄 ============
    { q: "敌方选出了「幻影刺客」，你选什么英雄克制她？", options: ["宙斯", "火枪", "敌法师", "以上均可（高爆发/克制闪避）"], correct: 3, tip: "宙斯的高爆发魔法伤害、火枪的射程优势、敌法师的削蓝都可以克制幻影刺客。" },
    { q: "敌方有「幻影长矛手」，你出什么装备克制？", options: ["狂战斧", "雷神之锤", "辉耀", "以上均可（清幻象）"], correct: 3, tip: "狂战斧、雷神之锤、辉耀等具有溅射或AOE效果的装备可以快速清理幻影长矛手的幻象。" },
    { q: "面对「冥魂大帝」的大招复活，你可以出什么装备克制？", options: ["否决坠饰", "散失之刃", "羊刀", "散失之刃或羊刀"], correct: 3, tip: "1、2级绝冥再生需要消耗魔法，散失之刃削蓝可以阻止复活；升到3级大招无蓝耗，散失无法阻止复活。羊刀可以硬控，在复活后继续限制。否决无法驱散复活被动。" },
    { q: "敌方「伐木机」很肉，你选什么英雄克制？", options: ["冥魂大帝", "宙斯", "莉娜", "宙斯、莉娜（高魔法爆发）"], correct: 3, tip: "伐木机害怕高魔法爆发，宙斯、莉娜可以快速击杀他；冥魂大帝输出方式并不天然克制伐木机。" },
    { q: "敌方有「幽鬼」，你出什么装备克制她的折射？", options: ["金箍棒", "大炮", "撒旦", "撒旦（吸血抵消折射反弹）"], correct: 2, tip: "幽鬼的折射会反弹伤害，撒旦的吸血可以抵消反弹伤害；金箍棒、大炮对折射反弹没有克制效果。" },
    { q: "面对「敌法师」的削蓝，你选什么英雄克制？", options: ["幻影刺客", "宙斯", "火枪", "以上均可（高物理爆发）"], correct: 3, tip: "敌法师害怕高物理爆发，幻影刺客、火枪等英雄可以在他削蓝前击杀他。" },
    { q: "敌方「修补匠」需要蓝量，你出什么装备克制？", options: ["散失之刃", "否决", "羊刀", "以上均可（削蓝/控制）"], correct: 3, tip: "散失之刃可以削蓝，否决可以驱散增益，羊刀可以控制，都是克制修补匠的有效装备。" },
    { q: "面对「帕吉」的钩子，你选什么英雄克制？", options: ["敌法师", "女王", "火猫", "以上均可（位移躲钩）"], correct: 3, tip: "拥有位移技能的英雄如敌法师、女王、火猫可以轻松躲开帕吉的钩子。注意：BKB挡不住钩——肉钩是无视减益免疫的，林肯法球和风杖才是有效的装备手段。" },
    { q: "敌方有「宙斯」，你出什么装备克制？", options: ["挑战头巾", "微光披风", "BKB", "以上均可（魔抗/减益免疫）"], correct: 3, tip: "挑战头巾提供魔抗，微光披风提供魔抗和隐身，BKB提供减益免疫，都能有效对抗宙斯。" },
    { q: "敌方「莱恩」有大量控制，你出什么装备克制？", options: ["林肯", "BKB", "风杖", "以上均可（视情况）"], correct: 3, tip: "林肯可以挡一个指向技能，BKB可以免疫控制，风杖可以躲技能，根据局势选择。" },
    // ============ 71-80 装备克制链 ============
    { q: "以下哪件装备克制「蝴蝶」？", options: ["金箍棒", "大炮", "撒旦", "以上均可部分克制"], correct: 0, tip: "金箍棒的克敌机先可以无视蝴蝶的闪避，是克制蝴蝶的核心装备。" },
    { q: "以下哪件装备克制「刃甲」？", options: ["撒旦之邪力", "蝴蝶", "金箍棒", "撒旦或蝴蝶（吸血/闪避）"], correct: 3, tip: "撒旦的吸血可以抵消反弹伤害，蝴蝶的闪避可以减少被击中；最佳策略是停手等待刃甲结束。金箍棒对刃甲无效。" },
    { q: "以下哪件装备克制「黑皇杖」？", options: ["深渊之刃", "否决坠饰", "羊刀", "深渊之刃或否决坠饰（机制不同）"], correct: 3, tip: "深渊之刃的主动眩晕无视减益免疫；否决需要提前挂目标，对方后续开BKB时，否决锁闭才能压制BKB增益。羊刀妖术无法命中开BKB的目标。" },
    { q: "以下哪件装备克制「林肯法球」？", options: ["散失之刃", "阿托斯之棍", "否决坠饰", "以上均可（指向技能消耗林肯屏障）"], correct: 3, tip: "散失之刃、阿托斯之棍、否决坠饰主动都是指向性技能，都可以消耗林肯的屏障。（阿托斯之棍当前版本仍在游戏中。）" },
    { q: "敌方用风杖把自己吹上了天，以下哪个做法是正确的？", options: ["用散失之刃驱散吹风", "用羊刀把他变羊", "用否决坠饰驱散吹风", "等他落地后再接控制"], correct: 3, tip: "吹起期间单位无敌且无法被选中，任何指向性装备和技能都无法选中他，只能等落地。预判落点、提前蹲好控制才是正确思路。" },
    { q: "以下哪件装备/手段克制「永恒之盘」？", options: ["否决坠饰（提前挂目标）", "散失之刃", "羊刀", "否决坠饰提前挂目标或羊刀"], correct: 3, tip: "否决坠饰提前挂目标，目标触发盘子时，盘子效果会被否决锁闭压制；**盘子触发不需要蓝，散失削蓝对盘子无效。否决无法驱散已经触发的盘子护盾。羊刀强控可以在盘子结束后继续限制。" },
    { q: "以下哪件装备克制「微光披风」？", options: ["否决坠饰", "散失之刃", "金箍棒", "否决、散失可驱散；金箍棒克制闪避"], correct: 3, tip: "否决坠饰和散失之刃可以驱散微光披风隐身增益，金箍棒克制闪避。" },

        // ---------- 状态 ----------
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let correctOptionIndex = -1;

        // DOM 元素
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const currentQSpan = document.getElementById('current-q');
        const totalQSpan = document.getElementById('total-q');
        const scoreValueSpan = document.getElementById('scoreValue');
        const tipContent = document.getElementById('tipContent'); // 新增提示内容容器

        // 初始化显示总题数
        totalQSpan.textContent = questions.length;

        // ---------- 辅助函数 ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 加载题目
        function loadQuestion(index) {
            answered = false;
            nextBtn.disabled = true;
            feedbackMsg.textContent = '';

            // 清空提示区域 (等待用户作答后再显示)
            tipContent.textContent = '点击选项后显示克制提示。';

            const qData = questions[index];
            if (!qData) return;

            questionText.textContent = qData.q;

            const correctText = qData.options[qData.correct];
            const shuffledOptions = shuffleArray([...qData.options]);
            correctOptionIndex = shuffledOptions.indexOf(correctText);

            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];

            shuffledOptions.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-index', idx);
                btn.innerHTML = `<span class="option-letter">${letters[idx]}</span>${optText}`;
                btn.addEventListener('click', () => handleOptionClick(idx, btn));
                optionsContainer.appendChild(btn);
            });

            currentQSpan.textContent = index + 1;
            scoreValueSpan.textContent = score;
        }

        // 处理选项点击
        function handleOptionClick(selectedIdx, btnElement) {
            if (answered) return;

            const allOptions = document.querySelectorAll('.option-btn');
            const isCorrect = (selectedIdx === correctOptionIndex);

            allOptions.forEach(btn => btn.classList.add('disabled'));

            allOptions.forEach((btn, idx) => {
                if (idx === correctOptionIndex) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            if (isCorrect) {
                score++;
                scoreValueSpan.textContent = score;
                feedbackMsg.textContent = '✅ 正确！ 克制关系掌握得不错。';
            } else {
                feedbackMsg.textContent = `❌ 错误！ 正确答案是 ${String.fromCharCode(65 + correctOptionIndex)}。`;
            }

            // 显示当前题目的提示 (无论对错)
            const currentQ = questions[currentIndex];
            if (currentQ && currentQ.tip) {
                tipContent.textContent = currentQ.tip;
            } else {
                tipContent.textContent = '（本题暂无额外提示）';
            }

            answered = true;
            nextBtn.disabled = false;
        }

        // 下一题
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion(currentIndex);
            } else {
                if (currentIndex === questions.length - 1 && answered) {
                    if (nextBtn.disabled) return;
                    questionText.textContent = `🎉 恭喜你完成全部 ${questions.length} 题！ 最终得分: ${score} / ${questions.length}`;
                    optionsContainer.innerHTML = '';
                    feedbackMsg.textContent = score >= 80 ? '🌟 大神！你对Dota2克制关系了如指掌。' : 
                                              score >= 50 ? '👍 还不错，再巩固一下细节吧。' : '📘 多看看装备和技能说明，再来挑战！';
                    // 完成时提示区域显示总结
                    tipContent.textContent = '克制之道，在于知己知彼。多实践，多思考，你也能成为刀塔智者。';
                    nextBtn.disabled = true;
                    currentQSpan.textContent = questions.length;
                } else {
                    if (!answered) return;
                }
            }
        }

        // 重置游戏
        function resetGame() {
            currentIndex = 0;
            score = 0;
            answered = false;
            scoreValueSpan.textContent = '0';
            loadQuestion(0);
            feedbackMsg.textContent = '';
            tipContent.textContent = '点击选项后显示克制提示。';
        }

        // 初始化
        function init() {
            loadQuestion(0);
            nextBtn.addEventListener('click', nextQuestion);
            resetBtn.addEventListener('click', resetGame);
        }

        init();
    </script>
